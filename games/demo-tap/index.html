<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Tap Targets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <style>
    body { background: color-mix(in oklab, var(--accent) 10%, var(--bg)); }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    .hud { position: fixed; left: 0; right: 0; bottom: calc(var(--s-4) + var(--safe-b)); display: flex; justify-content: center; gap: var(--s-6); pointer-events: none; font: 800 var(--fs-2)/1 var(--font-display); font-variant-numeric: tabular-nums; }
    .hud small { display: block; font: 600 var(--fs-s)/1.2 var(--font-text); color: var(--text-2); letter-spacing: .06em; text-transform: uppercase; }
    .hud div { text-align: center; min-width: 5ch; }
    .overlay { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: var(--s-4); text-align: center; padding: var(--s-5); background: color-mix(in oklab, var(--bg) 78%, transparent); animation: fade var(--t-med) both; }
    .overlay h1 { font-size: var(--fs-4); }
    .overlay p { color: var(--text-2); max-width: 32ch; }
    .overlay .big { font: 800 var(--fs-4)/1 var(--font-display); color: var(--accent-btn); }
    .row { display: flex; gap: var(--s-3); flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <canvas id="c" aria-label="Game area"></canvas>
  <div class="hud" aria-live="off"><div><small>Score</small><span id="score">0</span></div><div><small>Time</small><span id="time">30</span></div><div><small>Combo</small><span id="combo">0</span></div></div>
  <div class="overlay" id="ov"></div>

<script type="module">
import * as sdk from '../../assets/js/sdk.js';

const ID = 'demo-tap', DURATION = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = (id) => document.getElementById(id);
const ov = $('ov');
let W = 0, H = 0, DPR = 1, col = {};
let state = 'idle', t = 0, score = 0, combo = 0, hits = 0, target = null, parts = [], last = 0, paused = false, shake = 0;

/* ---- sizing & theme colours ---- */
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  col = { accent: cs.getPropertyValue('--accent').trim() || '#0f9d7a', text: cs.getPropertyValue('--text').trim(), dim: cs.getPropertyValue('--text-2').trim() };
}
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  readColors();
}
addEventListener('resize', resize);
sdk.onSettings(readColors);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);

/* ---- game logic ---- */
function spawn() {
  const r = Math.max(30, Math.min(W, H) * 0.075);
  const pad = r + 16, top = 72 + r, bottom = 96 + r; // keep clear of the hub bar and the HUD
  target = {
    x: pad + Math.random() * (W - pad * 2),
    y: top + Math.random() * Math.max(10, H - top - bottom),
    r, born: performance.now(), life: Math.max(600, 1300 - hits * 20),
  };
}
function burst(x, y) {
  if (sdk.getSettings().reducedMotion) return;
  for (let i = 0; i < 14; i++) { const a = Math.random() * 6.28, v = 80 + Math.random() * 200; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 }); }
}
function start() {
  state = 'play'; t = DURATION; score = combo = hits = 0; parts = []; ov.hidden = true;
  const d = sdk.load(ID, { plays: 0 }); sdk.save(ID, { plays: d.plays + 1 });
  spawn(); hud();
}
function end() {
  state = 'over'; target = null;
  const { best, isNew } = sdk.saveScore(ID, score);
  sdk.haptic(isNew ? 'success' : 'medium'); sdk.tone(isNew ? 880 : 330, 0.25, 'triangle');
  const plays = sdk.load(ID, { plays: 0 }).plays;
  ov.hidden = false;
  ov.innerHTML = `<p class="eyebrow">${isNew ? 'New personal best!' : 'Time’s up'}</p><div class="big">${score}</div><p>Best ${best} · ${plays} ${plays === 1 ? 'play' : 'plays'}</p>
    <div class="row"><button class="btn btn--primary btn--lg" id="again">Play again</button><button class="btn btn--lg" id="quit">Hub</button></div>`;
  $('again').onclick = start; $('quit').onclick = () => sdk.exit();
  $('again').focus();
}
function hud() { $('score').textContent = score; $('time').textContent = Math.ceil(Math.max(0, t)); $('combo').textContent = combo; }

function tap(x, y) {
  if (state !== 'play' || paused) return;
  if (target && Math.hypot(x - target.x, y - target.y) <= target.r * 1.3) {
    combo++; hits++; score += 10 + Math.min(combo, 10);
    sdk.haptic('light'); sdk.tone(520 + Math.min(combo, 12) * 40, 0.07);
    burst(target.x, target.y); spawn();
  } else { combo = 0; sdk.haptic('error'); sdk.tone(160, 0.1, 'square', 0.03); shake = 0.2; }
  hud();
}
cv.addEventListener('pointerdown', (e) => { e.preventDefault(); tap(e.clientX, e.clientY); });
addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') { e.preventDefault(); start(); } });

/* ---- loop (paused when hidden or when the hub shows its pause overlay) ---- */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (paused) return;
  if (state === 'play') {
    t -= dt;
    if (target && now - target.born > target.life) { combo = 0; spawn(); sdk.haptic('select'); }
    if (t <= 0) { t = 0; hud(); end(); }
    $('time').textContent = Math.ceil(t);
  }
  draw(now, dt);
}
function draw(now, dt) {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) { shake -= dt; ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8); }
  if (target) {
    const k = 1 - (now - target.born) / target.life;               // 1 → 0
    ctx.globalAlpha = 0.18; ctx.fillStyle = col.accent;
    ctx.beginPath(); ctx.arc(target.x, target.y, target.r * (1 + k * 0.9), 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowColor = col.accent; ctx.shadowBlur = 28;
    ctx.beginPath(); ctx.arc(target.x, target.y, target.r * (0.55 + 0.45 * Math.min(1, (now - target.born) / 120)), 0, 6.283); ctx.fill();
    ctx.shadowBlur = 0; ctx.lineWidth = 4; ctx.strokeStyle = col.text; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(target.x, target.y, target.r * 1.35, -Math.PI / 2, -Math.PI / 2 + 6.283 * Math.max(0, k)); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.fillStyle = col.accent;
  parts = parts.filter((p) => (p.life -= dt) > 0);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; ctx.globalAlpha = p.life * 2; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
  ctx.restore();
}

let pausedAt = 0;
sdk.onPause(() => { paused = true; pausedAt = performance.now(); });
sdk.onResume(() => { paused = false; last = performance.now(); if (target) target.born += last - pausedAt; }); // don't burn the target's life while paused

/* ---- boot ---- */
resize();
ov.innerHTML = `<h1>Tap Targets</h1><p>Hit every glowing target before its ring closes. ${DURATION} seconds on the clock.</p><p>Best: <b>${sdk.getBest(ID) ?? '–'}</b></p>
  <div class="row"><button class="btn btn--primary btn--lg" id="go">Start</button></div>`;
$('go').onclick = start; $('go').focus();
requestAnimationFrame((n) => { last = n; frame(n); });
</script>
</body>
</html>
